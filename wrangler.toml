# This project deploys as a Worker (Cloudflare's current git-integration —
# "Workers Builds" — provisions it that way even when created via a "Pages"
# option in the dashboard). `main` is the single script handling routing;
# [assets] serves everything in ./public as static files for any request
# the script doesn't explicitly handle (see worker/index.js).

name = "flashcard-drill"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Create this namespace under Workers & Pages -> KV, then replace the id
# below with the real one shown on the namespace's page (or via
# `wrangler kv namespace list`). Deploys fail without a real id here.
[[kv_namespaces]]
binding = "FLASHDRILL_SESSIONS"
id = "281b8513225242ed9e113911e4cdd685"
